# Starter CI — least privilege by default. Pin third-party actions to SHAs (pinact run).
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # first-party; pin to SHA when convenient
      # - uses: codecov/codecov-action@<SHA>   # third-party → SHA-pin (pinact)
