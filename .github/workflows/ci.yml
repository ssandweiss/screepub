# Least privilege by default. Pin third-party actions to SHAs (pinact run).
# Integration tests self-skip without fixtures/ (private, never committed);
# kit-check's conversion checks self-skip without Calibre — both stay green
# on bare runners.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
  app:
    runs-on: macos-15   # Swift 6 toolchain (macos-14 ships 5.10)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build -c release
        working-directory: app
      - run: swift run -c release kit-check
        working-directory: app
