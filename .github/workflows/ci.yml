# Least privilege by default. Pin third-party actions to SHAs (pinact run).
# Integration tests self-skip without fixtures/ (private, never committed);
# kit-check's conversion checks self-skip without Calibre — both stay green
# on bare runners.
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # first-party; pin to SHA when convenient
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4   # first-party; pin to SHA when convenient
      - run: swift build -c release
        working-directory: app
      - run: swift run -c release kit-check
        working-directory: app
