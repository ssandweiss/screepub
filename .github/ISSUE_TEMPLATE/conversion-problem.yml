name: Conversion problem
description: A script converted, but the e-book came out wrong
labels: [conversion]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't attach a confidential script.** Conversion bugs are
        almost always about where text sat on the page, not what it said.
        A description usually gets us there, and `tools/make-fixture.py`
        builds a small invented script that reproduces a given shape.
  - type: textarea
    id: what-went-wrong
    attributes:
      label: What came out wrong?
      description: And what did you expect instead?
      placeholder: |
        Character cues ended up in the middle of the action paragraphs,
        starting around page 40.
    validations:
      required: true
  - type: input
    id: written-in
    attributes:
      label: What was the PDF written in?
      placeholder: Final Draft 13 / Highland / Fade In / Celtx / unknown
  - type: dropdown
    id: where-seen
    attributes:
      label: Where did you see the problem?
      multiple: true
      options:
        - Screepub's built-in reader
        - On the e-reader after sending
        - In the EPUB opened elsewhere
        - In the .fountain file
  - type: input
    id: device
    attributes:
      label: Which e-reader?
      placeholder: Kindle Paperwhite 11th gen, firmware 5.19.2
  - type: dropdown
    id: platform
    attributes:
      label: Which computer?
      options:
        - Mac
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which Screepub?
      options:
        - The app (Screepub, on a Mac, Windows or Linux)
        - The command line (screepub)
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Screepub and system versions
      description: The app shows its version at the foot of the page; the command line with `screepub --version`.
      placeholder: Screepub 0.7.4, macOS 15.6
    validations:
      required: true
